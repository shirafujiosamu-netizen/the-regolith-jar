// ============ STATE ============
var lat=31.2304, lon=121.4737, locName="上海";
var yaw=0, pitch=45, fov=60;            // view direction (yaw=azimuth, pitch=altitude)
var dpr=Math.min(window.devicePixelRatio||1,2);
/* ===== 背景模式 (2026-10-19)：被 OC 页以 iframe ?bg=1 嵌入时 =====
   隐藏交互 UI、粗指针 DPR 封顶 1.5、动画节流 4Hz（背景不需要 60fps） */
var BG=/[?&]bg=1/.test(location.search);
if(BG){
  var _coarse=window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;
  dpr=Math.min(window.devicePixelRatio||1,_coarse?1.5:2);
  ['status','hint','card'].forEach(function(id){var e=document.getElementById(id);if(e)e.style.display='none';});
}
var activeCon=null, pinnedCon=null;
var dragging=false, hovering=false;

// ============ TIME / SKY MATH ============
function getLST(date,lonDeg){
  var jd=date.getTime()/86400000+2440587.5;
  var D=jd-2451545.0;
  var gmst=(280.46061837+360.98564736629*D)%360; if(gmst<0)gmst+=360;
  var lst=(gmst+lonDeg)%360; if(lst<0)lst+=360;
  return lst;
}
function altAz(raDeg,decDeg,lstDeg,latDeg){
  var ha=lstDeg-raDeg; ha=((ha+180)%360+360)%360-180;
  var haR=ha*Math.PI/180, latR=latDeg*Math.PI/180, decR=decDeg*Math.PI/180;
  var alt=Math.asin(Math.sin(latR)*Math.sin(decR)+Math.cos(latR)*Math.cos(decR)*Math.cos(haR));
  var az=Math.atan2(Math.sin(haR),Math.cos(haR)*Math.sin(latR)-Math.tan(decR)*Math.cos(latR));
  az=(az*180/Math.PI+360)%360;
  return {alt:alt*180/Math.PI,az:az};
}
var LST=0;
function computeSky(){
  LST=getLST(new Date(),lon);
}

// ============ THREE SETUP ============
var R=100;
var canvas=document.getElementById("c");
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setPixelRatio(dpr);
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(fov,1,0.1,2000);

function toVec(alt,az){
  var a=alt*Math.PI/180, z=az*Math.PI/180, ch=Math.cos(a);
  return new THREE.Vector3(ch*Math.sin(z), Math.sin(a), -ch*Math.cos(z)).multiplyScalar(R);
}

// ---- star 3D positions + altitude (once) ----
var starVec=[], starAlt=new Float32Array(STARS.length);
computeSky();
for(var i=0;i<STARS.length;i++){
  var s=STARS[i];
  var aa=altAz(s.ra*15,s.dec,LST,lat);
  starAlt[i]=aa.alt;
  starVec.push(toVec(aa.alt,aa.az));
}

// ---- realistic star sprites (tight core + soft Gaussian falloff) ----
function makeStarTex(rgb, size){
  var S=size||64,c=document.createElement("canvas");c.width=c.height=S;
  var g=c.getContext("2d");
  var R0=rgb[0],G0=rgb[1],B0=rgb[2];
  // tight bright core with long soft tail — no hard disc
  var grd=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  grd.addColorStop(0,"rgba(255,255,255,1)");
  grd.addColorStop(0.05,"rgba(255,253,245,.96)");
  grd.addColorStop(0.14,"rgba("+R0+","+G0+","+B0+",.55)");
  grd.addColorStop(0.38,"rgba("+R0+","+G0+","+B0+",.15)");
  grd.addColorStop(0.65,"rgba("+R0+","+G0+","+B0+",.04)");
  grd.addColorStop(1,"rgba("+R0+","+G0+","+B0+",0)");
  g.fillStyle=grd;g.fillRect(0,0,S,S);
  return new THREE.CanvasTexture(c);
}
var spBright=makeStarTex([255,246,225],64);
var spMid  =makeStarTex([222,232,255],64);
var spDim  =makeStarTex([188,208,245],64);
var spGray=makeStarTex([120,132,152],64);

function makePoints(posArray,tex,size,opacity){
  if(!posArray.length) return null;
  var g=new THREE.BufferGeometry();
  var arr=new Float32Array(posArray.length*3);
  for(var k=0;k<posArray.length;k++){
    arr[k*3]=posArray[k].x; arr[k*3+1]=posArray[k].y; arr[k*3+2]=posArray[k].z;
  }
  g.setAttribute("position",new THREE.BufferAttribute(arr,3));
  var m=new THREE.PointsMaterial({
    map:tex,size:size,sizeAttenuation:false,
    transparent:true,opacity:opacity,depthWrite:false,depthTest:false,
    blending:THREE.AdditiveBlending
  });
  return new THREE.Points(g,m);
}

// distribute stars into tiers by magnitude + above/below horizon
var bPos=[],mPos=[],dPos=[],gPos=[];
for(var i=0;i<STARS.length;i++){
  var v=starVec[i];
  if(starAlt[i]<0){ gPos.push(v); continue; }
  var mg=STARS[i].mag;
  if(mg<=1.5) bPos.push(v);
  else if(mg<=3.5) mPos.push(v);
  else dPos.push(v);
}
var pBright=makePoints(bPos,spBright,7,0.95);
var pMid  =makePoints(mPos,spMid,4.5,0.88);
var pDim  =makePoints(dPos,spDim,3,0.78);
var pGray =makePoints(gPos,spGray,3,0.45);
[pBright,pMid,pDim,pGray].forEach(function(p){ if(p) scene.add(p); });

// ---- constellation lines (per constellation) ----
var conLines={}, conStarIdx={}, conMidAlt={};
for(var i=0;i<STARS.length;i++){ var c=STARS[i].con; (conStarIdx[c]=conStarIdx[c]||[]).push(i); }
// average altitude of each constellation's stars -> below-horizon dims (not hidden)
function computeConAlt(){
  conMidAlt={};
  Object.keys(conStarIdx).forEach(function(c){
    var mem=conStarIdx[c], sum=0,n=0;
    for(var k=0;k<mem.length;k++){ sum+=starAlt[mem[k]]; n++; }
    conMidAlt[c]= n? sum/n : 0;
  });
}
computeConAlt();
var linePosCache={};   // seg index -> [vecA, vecB]
for(var li=0;li<LINES.length;li++){
  var L=LINES[li];
  var aa=altAz(L.a[0],L.a[1],LST,lat), ab=altAz(L.b[0],L.b[1],LST,lat);
  // render all segments (do NOT skip below-horizon); dimming handled in tickAnim
  var va=toVec(aa.alt,aa.az), vb=toVec(ab.alt,ab.az);
  linePosCache[li]=[va,vb];
  var arr=(conLines[L.c]=conLines[L.c]||[]);
  arr.push(va.x,va.y,va.z, vb.x,vb.y,vb.z);
}
var conLineObj={};
Object.keys(conLines).forEach(function(c){
  var g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(new Float32Array(conLines[c]),3));
  var m=new THREE.LineBasicMaterial({color:0x88bbff,transparent:true,opacity:0.38,depthWrite:false,depthTest:false});
  var seg=new THREE.LineSegments(g,m);
  conLineObj[c]=seg; scene.add(seg);
});

// ---- smooth hover animation state ----
var anim={tLineOp:0.38,tLineCol:0x88bbff,cLineOp:0.38,cLineCol:0x88bbff,
         tStarScale:1,cStarScale:1, speed:5};
// per-line material reference + original values cache
var lineOrig={}; // c -> {op, col}
Object.keys(conLineObj).forEach(function(c){ lineOrig[c]={op:0.38,col:0x88bbff}; });
// member star base positions (for scaling)
var memBasePos={}; // con -> [{x,y,z}, ...]

// ---- subtle member-star brighten overlay (used by animation, NOT the old blob) ----
var hlMat=new THREE.PointsMaterial({map:spBright,size:9,sizeAttenuation:false,
  transparent:true,opacity:.85,depthWrite:false,depthTest:false,
  blending:THREE.AdditiveBlending});
var hlGeo=new THREE.BufferGeometry();
hlGeo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(3),3));
var hlPoints=new THREE.Points(hlGeo,hlMat); hlPoints.visible=false; scene.add(hlPoints);

// ---- horizon ring (alt=0 great circle) ----
(function(){
  var pts=[];
  for(var t=0;t<=360;t+=4){
    var a=t*Math.PI/180, ch=Math.cos(0);
    pts.push(new THREE.Vector3(Math.cos(0)*Math.sin(a)*R, 0, -Math.cos(0)*Math.cos(a)*R));
  }
  var g=new THREE.BufferGeometry().setFromPoints(pts);
  var m=new THREE.LineBasicMaterial({color:0x7fb0ff,transparent:true,opacity:0.18,depthWrite:false,depthTest:false});
  scene.add(new THREE.Line(g,m));
})();

// ============ DOM LABELS ============
var lblBox=document.createElement("div");
lblBox.style.cssText="position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5";
document.body.appendChild(lblBox);
var starLbls=[], conLbls={};
STARS.forEach(function(s,idx){
  if(s.name && s.mag<=3.5){
    var el=document.createElement("div");
    el.className="star-lbl"+(s.mag<=1.5?" bright":"");
    el.textContent=s.name; lblBox.appendChild(el);
    starLbls.push({el:el,idx:idx});
  }
});
Object.keys(INFO).forEach(function(id){
  if(!INFO[id].zh)return;
  var el=document.createElement("div");
  el.className="con-lbl"; el.textContent=INFO[id].zh;
  el.addEventListener("click",function(e){e.stopPropagation();pinnedCon=(pinnedCon===id?null:id);setActive(pinnedCon);});
  lblBox.appendChild(el);
  conLbls[id]=el;
});

// ============ CAMERA UPDATE ============
var W=0,H=0;
function updateCamera(){
  pitch=Math.max(-3,Math.min(86,pitch));
  fov=Math.max(22,Math.min(85,fov));
  var dir=toVec(pitch,yaw);
  var zenith=new THREE.Vector3(0,1,0);
  var up=zenith.clone().sub(dir.clone().multiplyScalar(zenith.dot(dir)));
  if(up.lengthSq()<1e-4) up.set(0,0,1);
  up.normalize();
  camera.position.set(0,0,0);
  camera.up.copy(up);
  camera.lookAt(dir);
  camera.fov=fov; camera.updateProjectionMatrix();
}

// ============ SCREEN PROJECTION (labels + hover pick) ============
var sxArr=new Float32Array(STARS.length), syArr=new Float32Array(STARS.length), svArr=new Uint8Array(STARS.length);
var _v=new THREE.Vector3();
function projectAll(){
  for(var i=0;i<STARS.length;i++){
    _v.copy(starVec[i]).project(camera);
    var x=(_v.x*0.5+0.5)*W, y=(-_v.y*0.5+0.5)*H;
    sxArr[i]=x; syArr[i]=y;
    svArr[i]=(_v.z<1 && _v.z>-1 && _v.x>-1.15 && _v.x<1.15 && _v.y>-1.15 && _v.y<1.15)?1:0;
  }
}
function updateLabels(){
  for(var i=0;i<starLbls.length;i++){
    var it=starLbls[i];
    if(!svArr[it.idx] || starAlt[it.idx]<2){ it.el.style.opacity=0; continue; }
    it.el.style.left=sxArr[it.idx]+"px"; it.el.style.top=syArr[it.idx]+"px"; it.el.style.opacity=1;
  }
  Object.keys(conLbls).forEach(function(id){
    var mem=conStarIdx[id]; if(!mem)return;
    var n=0,sx=0,sy=0;
    for(var j=0;j<mem.length;j++){
      var mi=mem[j]; if(!svArr[mi])continue;
      sx+=sxArr[mi]; sy+=syArr[mi]; n++;
    }
    var el=conLbls[id];
    if(n>=2){
      el.style.left=(sx/n)+"px"; el.style.top=(sy/n)+"px";
      el.style.opacity=(id===activeCon)?1:0.55;
      el.classList.toggle("active",id===activeCon);
    } else el.style.opacity=0;
  });
}

// ============ HOVER PICK ============
var card=document.getElementById("card");
var cStar=document.getElementById("c-star"),cCon=document.getElementById("c-con"),cDs=document.getElementById("c-ds");
function distToSeg(px,py,ax,ay,bx,by){
  var dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  if(l2===0)return Math.hypot(px-ax,py-ay);
  var t=((px-ax)*dx+(py-ay)*dy)/l2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function pick(px,py){
  var bestStar=-1,bestStarD=16, bestLine=-1,bestLineD=12;
  for(var i=0;i<STARS.length;i++){
    if(!svArr[i])continue;
    var d=Math.hypot(px-sxArr[i],py-syArr[i]);
    if(d<bestStarD){bestStarD=d;bestStar=i;}
  }
  for(var li=0;li<LINES.length;li++){
    var L=LINES[li];
    var ca=linePosCache[li]; if(!ca)continue;
    // project endpoints
    _v.copy(ca[0]).project(camera); var ax=(_v.x*0.5+0.5)*W, ay=(-_v.y*0.5+0.5)*H;
    _v.copy(ca[1]).project(camera); var bx=(_v.x*0.5+0.5)*W, by=(-_v.y*0.5+0.5)*H;
    if(_v.z>1)continue;
    var d=distToSeg(px,py,ax,ay,bx,by);
    if(d<bestLineD){bestLineD=d;bestLine=li;}
  }
  var pickCon=null, starObj=null;
  if(bestStar>=0 && bestStarD<=bestLineD){ pickCon=STARS[bestStar].con; starObj=STARS[bestStar]; }
  else if(bestLine>=0){ pickCon=LINES[bestLine].c; }
  setActive(pickCon);
  if(pickCon){
    var im=INFO[pickCon];
    cCon.innerHTML=(im?im.zh:pickCon)+(im&&im.en?" <span style='color:#7f8fc8;font-size:9px'>"+im.en+"</span>":"");
    cDs.textContent=(im&&im.desc)?im.desc:'';
    cDs.style.display=(im&&im.desc)?'block':'none';
    cStar.textContent=starObj?(starObj.name||("星等 "+starObj.mag.toFixed(1))):"";
    var x=px+18,y=py+18, r=card.getBoundingClientRect();
    if(x+300>W)x=px-306; if(y+150>H)y=py-156;
    card.style.left=x+"px"; card.style.top=y+"px"; card.classList.add("show");
  } else { card.classList.remove("show"); }
}
function setActive(con){
  con=con||pinnedCon;
  if(con===activeCon) return;
  activeCon=con;
  if(activeCon && conStarIdx[activeCon]){
    // cache member base positions for scale animation
    var mem=conStarIdx[activeCon];
    memBasePos[activeCon]=[];
    for(var k=0;k<mem.length;k++){
      var v=starVec[mem[k]];
      if(STARS[mem[k]].mag>3.5) continue;
      memBasePos[activeCon].push({x:v.x,y:v.y,z:v.z});
    }
    anim.tLineOp=0.95; anim.tLineCol=0xcde4ff;
    anim.tStarScale=1.6;
  } else {
    anim.tLineOp=0.30; anim.tLineCol=0x88bbff;
    anim.tStarScale=1;
  }
}

// ============ INTERACTION ============
var pointers={},lastX=0,lastY=0,lastPinch=0;
canvas.addEventListener("pointerdown",function(e){
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  dragging=true;hovering=false;lastX=e.clientX;lastY=e.clientY;lastPinch=0;
  card.classList.remove("show"); setActive(pinnedCon);
});
window.addEventListener("pointerup",function(e){delete pointers[e.pointerId];dragging=false;if(Object.keys(pointers).length===0)lastPinch=0;});
window.addEventListener("pointercancel",function(e){delete pointers[e.pointerId];dragging=false;});
window.addEventListener("pointermove",function(e){
  if(pointers[e.pointerId])pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(pointers);
  if(ids.length>=2){
    dragging=false;
    var p1=pointers[ids[0]],p2=pointers[ids[1]];
    var dist=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    if(lastPinch>0) fov=Math.max(22,Math.min(85,fov*(lastPinch/dist)));
    lastPinch=dist; return;
  }
  lastPinch=0;
  if(dragging){
    var dx=e.clientX-lastX,dy=e.clientY-lastY;
    yaw-=dx*0.3; pitch+=dy*0.3; lastX=e.clientX; lastY=e.clientY;
  } else {
    hovering=true; pick(e.clientX,e.clientY);
  }
});
canvas.addEventListener("wheel",function(e){e.preventDefault();fov=Math.max(22,Math.min(85,fov*(e.deltaY>0?1.08:0.92)));},{passive:false});
canvas.addEventListener("pointerleave",function(){hovering=false;setActive(pinnedCon);card.classList.remove("show");});

// ============ RESIZE / INIT ============
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  renderer.setSize(W,H,false);
  camera.aspect=W/H; camera.updateProjectionMatrix();
  updateStatus();
}
window.addEventListener("resize",resize);

function updateStatus(){
  var d=new Date();
  function p(n){return (n<10?"0":"")+n;}
  var t=p(d.getHours())+":"+p(d.getMinutes());
  var dt=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  document.getElementById("status").innerHTML=
    "<b>"+locName+"</b> · "+dt+" "+t+"<br>当前头顶星空 · 共 "+visibleCount()+" 颗可见";
}
function visibleCount(){ var n=0; for(var i=0;i<STARS.length;i++) if(starAlt[i]>=0) n++; return n; }

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(function(pos){
    lat=pos.coords.latitude; lon=pos.coords.longitude; locName="当前位置";
    computeSky();
    for(var i=0;i<STARS.length;i++){
      var aa=altAz(STARS[i].ra*15,STARS[i].dec,LST,lat);
      starAlt[i]=aa.alt; starVec[i]=toVec(aa.alt,aa.az);
    }
    // rebuild point geometries & line cache
    rebuildStars(); rebuildLines();
    updateStatus();
  },function(){},{timeout:4000,maximumAge:600000});
}

function rebuildStars(){
  var bPos2=[],mPos2=[],dPos2=[],gPos2=[];
  for(var i=0;i<STARS.length;i++){
    var v=starVec[i];
    if(starAlt[i]<0){ gPos2.push(v); continue; }
    var mg=STARS[i].mag;
    if(mg<=1.5) bPos2.push(v); else if(mg<=3.5) mPos2.push(v); else dPos2.push(v);
  }
  if(pBright){scene.remove(pBright);pBright.geometry.dispose();}
  if(pMid){scene.remove(pMid);pMid.geometry.dispose();}
  if(pDim){scene.remove(pDim);pDim.geometry.dispose();}
  if(pGray){scene.remove(pGray);pGray.geometry.dispose();}
  pBright=makePoints(bPos2,spBright,7,0.95);
  pMid  =makePoints(mPos2,spMid,4.5,0.88);
  pDim  =makePoints(dPos2,spDim,3,0.78);
  pGray =makePoints(gPos2,spGray,3,0.45);
  [pBright,pMid,pDim,pGray].forEach(function(p){ if(p) scene.add(p); });
}
function rebuildLines(){
  Object.keys(conLineObj).forEach(function(c){ scene.remove(conLineObj[c]); conLineObj[c].geometry.dispose(); });
  conLineObj={}; linePosCache={};
  for(var li=0;li<LINES.length;li++){
    var L=LINES[li];
    var aa=altAz(L.a[0],L.a[1],LST,lat), ab=altAz(L.b[0],L.b[1],LST,lat);
    // render all segments (do NOT skip below-horizon); dimming handled in tickAnim
    var va=toVec(aa.alt,aa.az), vb=toVec(ab.alt,ab.az);
    linePosCache[li]=[va,vb];
    var arr=(conLines[L.c]=conLines[L.c]||[]);
    arr.push(va.x,va.y,va.z, vb.x,vb.y,vb.z);
  }
  computeConAlt();
  Object.keys(conLines).forEach(function(c){
    var g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.BufferAttribute(new Float32Array(conLines[c]),3));
    var m=new THREE.LineBasicMaterial({color:0x88bbff,transparent:true,opacity:0.38,depthWrite:false,depthTest:false});
    var seg=new THREE.LineSegments(g,m); conLineObj[c]=seg; scene.add(seg);
  });
  if(activeCon) setActive(activeCon);
}

// ============ ANIMATION LERP (smooth light-up) ============
function lerp(a,b,t){return a+(b-a)*t;}
function lerpColor(c1,c2,t){
  var r1=(c1>>16)&0xff,g1=(c1>>8)&0xff,b1=c1&0xff;
  var r2=(c2>>16)&0xff,g2=(c2>>8)&0xff,b2=c2&0xff;
  return (Math.round(lerp(r1,r2,t))<<16)|(Math.round(lerp(g1,g2,t))<<8)|Math.round(lerp(b1,b2,t));
}
function tickAnim(dt){
  if(!dt) dt=0.016;
  var s=1-Math.pow(0.001,dt*anim.speed); // smooth ease
  anim.cLineOp=lerp(anim.cLineOp,anim.tLineOp,s);
  anim.cLineCol=lerpColor(anim.cLineCol,anim.tLineCol,s);
  anim.cStarScale=lerp(anim.cStarScale,anim.tStarScale,s);
  // apply to active constellation lines
  Object.keys(conLineObj).forEach(function(c){
    var m=conLineObj[c].material;
    if(c===activeCon){
      m.opacity=anim.cLineOp; m.color.setHex(Math.round(anim.cLineCol));
    } else {
      // below-horizon constellations stay faint; others dim when one is active
      var baseOp=(conMidAlt[c]!==undefined && conMidAlt[c]<0)?0.13:0.38;
      m.opacity=Math.max(0.05, baseOp-(anim.cLineOp-0.38)*0.5); m.color.setHex(0x88bbff);
    }
  });
  // scale member stars of active constellation
  if(activeCon && memBasePos[activeCon] && conStarIdx[activeCon]){
    var mem=conStarIdx[activeCon], base=memBasePos[activeCon];
    var arr=new Float32Array(base.length*3);
    for(var k=0;k<base.length;k++){
      // 高亮点保持在原位置，靠点尺寸放大来强调；乘 scale 会把星推出球面，造成与真实星点错位
      arr[k*3]=base[k].x; arr[k*3+1]=base[k].y; arr[k*3+2]=base[k].z;
    }
    hlGeo.setAttribute("position",new THREE.BufferAttribute(arr,3));
    hlMat.size = 9 * anim.cStarScale;
    hlGeo.setDrawRange(0,base.length); hlPoints.visible=true;
  } else { hlPoints.visible=false; }
}

// ============ RENDER LOOP ============
var lastT=performance.now();
var _bgLast=0;
function frame(){
  var now=performance.now(), dt=(now-lastT)/1000; lastT=now;
  if(BG&&now-_bgLast<240){requestAnimationFrame(frame);return;}
  _bgLast=now;
  tickAnim(dt);
  updateCamera();
  renderer.render(scene,camera);
  projectAll();
  updateLabels();
  requestAnimationFrame(frame);
}
resize();
updateCamera();
frame();
setInterval(updateStatus,30000);
})();
</script></body></html>
